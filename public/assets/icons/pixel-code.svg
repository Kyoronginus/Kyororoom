<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <!-- CRT monitor body -->
  <rect x="1" y="2" width="14" height="11" fill="#2d3748"/>
  <rect x="2" y="3" width="12" height="9" fill="#1a202c"/>
  <!-- Monitor stand -->
  <rect x="6" y="13" width="4" height="1" fill="#4a5568"/>
  <rect x="4" y="14" width="8" height="1" fill="#2d3748"/>
  <!-- Screen contents: pixel prompt '>_' -->
  <rect x="4" y="5" width="1" height="1" fill="#48bb78"/>
  <rect x="5" y="6" width="1" height="1" fill="#48bb78"/>
  <rect x="4" y="7" width="1" height="1" fill="#48bb78"/>
  <rect x="7" y="7" width="2" height="1" fill="#38bdf8"/>
  <rect x="7" y="9" width="4" height="1" fill="#4a5568"/>
</svg>
